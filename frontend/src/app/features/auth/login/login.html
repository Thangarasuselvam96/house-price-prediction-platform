<div class="login-page">

  <div class="login-card">

    <h1>Welcome Back</h1>

    <p>Login to your Magic Brick account</p>

    <form (ngSubmit)="login()">

      <label>Email</label>

      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="Enter your email"
        required
      />

      <label>Password</label>

      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Enter your password"
        required
      />

      <button type="submit">
        Login
      </button>

    </form>

    <a href="#">
      Forgot Password?
    </a>

  </div>

</div>
