<section class="seller-dashboard">

  <div class="dashboard-header">

    <div>
      <h1>Seller Dashboard</h1>

      <p>
        Manage your properties and listings
      </p>
    </div>

    <button
      type="button"
      class="add-property-btn">

      + Add Property

    </button>

  </div>


  <div class="stats">

    <div class="stat-card">
      <span>Total Properties</span>
      <strong>{{ dashboard?.totalProperties ?? 0 }}</strong>
    </div>

    <div class="stat-card">
      <span>Active Listings</span>
      <strong>{{ dashboard?.activeProperties ?? 0 }}</strong>
    </div>

    <div class="stat-card">
      <span>Sold</span>
      <strong>{{ dashboard?.soldProperties ?? 0 }}</strong>
    </div>

  </div>


  <section class="my-properties">

    <div class="section-header">

      <h2>My Properties</h2>

    </div>

    <div class="empty-state">

      <h3>No properties yet</h3>

      <p>
        Start by adding your first property.
      </p>

      <button type="button">
        + Add Your First Property
      </button>

    </div>

  </section>

</section>
